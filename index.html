<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD - SPEECH & LISTENING QUANTUM CORE</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #010206; 
            font-family: 'Courier New', monospace; 
            user-select: none;
            touch-action: none;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        body::before {
            content: " ";
            display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 4; background-size: 100% 3px, 6px 100%; pointer-events: none;
        }

        #webcam {
            position: absolute; bottom: 20px; right: 20px;
            width: 170px; height: 125px; z-index: 5;
            border-radius: 6px; border: 1.5px solid #00f3ff;
            transform: scaleX(-1); opacity: 0.7;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            object-fit: cover;
        }

        #overlay {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            color: #00f3ff; font-size: 14px; letter-spacing: 2px;
            pointer-events: none; text-shadow: 0 0 8px #0088ff;
        }

        .hud-corner {
            position: absolute; width: 30px; height: 30px; z-index: 5;
            border: 2px solid #00f3ff; pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        .top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        .code-panel {
            position: absolute; top: 90px; z-index: 5;
            color: rgba(0, 243, 255, 0.5); font-size: 11px;
            pointer-events: none; line-height: 1.4;
            font-family: monospace; text-shadow: 0 0 5px rgba(0, 136, 255, 0.5);
        }
        #code-left { left: 20px; width: 230px; }
        #code-right { right: 20px; width: 230px; text-align: right; }

        .status { color: #00f3ff; font-size: 13px; margin-top: 5px; font-weight: bold; }
        
        #ai-container {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            width: calc(100% - 240px); max-width: 650px;
        }

        #ai-text { 
            color: #00ffff; font-size: 14px; font-weight: normal; 
            background: rgba(0, 20, 40, 0.85); padding: 10px 14px;
            border-left: 3px solid #00f3ff; border-radius: 4px;
            max-height: 100px; overflow-y: auto; text-shadow: 0 0 5px #00f3ff;
            margin-bottom: 8px; display: none; line-height: 1.5;
        }

        .chat-input-box {
            display: flex; gap: 8px;
        }

        .chat-input-box input {
            flex: 1; background: rgba(0, 10, 25, 0.9);
            border: 1px solid #00f3ff; color: #00ffff;
            padding: 8px 12px; font-family: monospace; font-size: 13px;
            outline: none; border-radius: 4px; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .chat-input-box button {
            background: rgba(0, 243, 255, 0.2); border: 1px solid #00f3ff;
            color: #00ffff; padding: 8px 14px; font-family: monospace;
            cursor: pointer; font-weight: bold; transition: 0.2s; border-radius: 4px;
        }

        .chat-input-box button:hover {
            background: rgba(0, 243, 255, 0.5); box-shadow: 0 0 15px #00f3ff;
        }

        #mic-btn.listening {
            background: rgba(255, 0, 50, 0.6) !important;
            border-color: #ff0055 !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px #ff0055 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 380px; height: 380px; z-index: 3; pointer-events: none; opacity: 0.45;
        }
    </style>
    <!-- Three.js, OrbitControls & MediaPipe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div id="overlay">
        SYSTEM: MARK-VII ARC HUD [QUANTUM CORE]<br>
        <div class="status" id="status-text">STATUS: INITIALIZING...</div>
    </div>

    <div id="code-left" class="code-panel"></div>
    <div id="code-right" class="code-panel"></div>

    <div id="ai-container">
        <div id="ai-text"></div>
        <div class="chat-input-box">
            <input type="text" id="user-input" placeholder="Ask JARVIS a question or tap MIC..." onkeydown="if(event.key==='Enter') sendToGemini()">
            <button id="mic-btn" onclick="toggleListening()">🎤 MIC</button>
            <button onclick="sendToGemini()">QUERY</button>
        </div>
    </div>

    <svg id="reticle" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="95" stroke="#00f3ff" stroke-width="0.8" fill="none" stroke-dasharray="4,4"/>
        <circle cx="100" cy="100" r="80" stroke="#00aaff" stroke-width="0.5" fill="none"/>
        <line x1="100" y1="0" x2="100" y2="20" stroke="#00f3ff" stroke-width="1.5"/>
        <line x1="100" y1="180" x2="100" y2="200" stroke="#00f3ff" stroke-width="1.5"/>
        <line x1="0" y1="100" x2="20" y2="100" stroke="#00f3ff" stroke-width="1.5"/>
        <line x1="180" y1="100" x2="200" y2="100" stroke="#00f3ff" stroke-width="1.5"/>
    </svg>

    <video id="webcam" autoplay playsinline muted></video>

    <script>
        // API KEY Hardcoded Directly
        const apiKey = "AQ.Ab8RN6KAEeCpc_Ajmpr_kBpdvBhw1NkXV40R9LrxkW_hdwXITw";

        const statusText = document.getElementById('status-text');
        const aiText = document.getElementById('ai-text');
        const micBtn = document.getElementById('mic-btn');
        const inputField = document.getElementById('user-input');

        let chatHistory = [];

        async function sendToGemini() {
            const promptText = inputField.value.trim();
            if (!promptText) return;

            aiText.style.display = 'block';
            aiText.innerText = "JARVIS: Thinking...";
            inputField.value = "";

            chatHistory.push({
                role: "user",
                parts: [{ text: promptText }]
            });

            try {
                // Key passed as URL query parameter to bypass browser CORS header restrictions
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "You are JARVIS, a suave, intelligent male AI assistant. Speak like a natural human male—calm, confident, articulate, and friendly. Avoid robotic talk or markdown formatting like asterisks. Keep answers concise." }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                if (data.error) {
                    aiText.innerText = "JARVIS: " + data.error.message;
                    chatHistory.pop();
                    return;
                }
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    
                    chatHistory.push({
                        role: "model",
                        parts: [{ text: reply }]
                    });

                    aiText.innerText = "JARVIS: " + reply;
                    speakText(reply);
                }
            } catch (err) {
                aiText.innerText = "JARVIS: Connection error. Please try again.";
                chatHistory.pop();
            }
        }

        // --- VOICE INPUT ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = "🎙️ LISTENING...";
                statusText.innerText = "STATUS: LISTENING FOR VOICE...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                inputField.value = transcript;
                sendToGemini();
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            micBtn.style.display = 'none';
        }

        function toggleListening() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Use Chrome or Edge.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 MIC";
            statusText.innerText = "STATUS: READY - MOUSE/TOUCH OR HANDS";
        }

        // --- VOICE OUTPUT ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*_#`]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                
                utterance.rate = 1.0; 
                utterance.pitch = 0.92; 

                const voices = window.speechSynthesis.getVoices();
                
                const maleVoiceNames = [
                    'Google UK English Male', 
                    'Microsoft David', 
                    'Microsoft Guy', 
                    'Microsoft George', 
                    'Daniel', 
                    'Alex', 
                    'Google US English Male'
                ];

                let chosenVoice = null;
                for (let name of maleVoiceNames) {
                    chosenVoice = voices.find(v => v.name.includes(name));
                    if (chosenVoice) break;
                }

                if (!chosenVoice) {
                    chosenVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male'));
                }

                if (chosenVoice) {
                    utterance.voice = chosenVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // --- TELEMETRY STREAM ---
        const fakeSnippets = [
            "ARC_REACTOR_OUTPUT: 100%", "VOICE_MODULE: MALE_CONFIG",
            "QUANTUM_CORE: SYNCHRONIZED", "TOUCH_ORBIT: ACTIVE",
            "DECRYPT_STREAM // 4096-bit", "MEMORY_BUFFER: ACTIVE"
        ];

        function updateCodePanels() {
            let leftHTML = "", rightHTML = "";
            for (let i = 0; i < 10; i++) {
                leftHTML += fakeSnippets[Math.floor(Math.random() * fakeSnippets.length)] + "<br>";
                rightHTML += fakeSnippets[Math.floor(Math.random() * fakeSnippets.length)] + "<br>";
            }
            document.getElementById('code-left').innerHTML = leftHTML;
            document.getElementById('code-right').innerHTML = rightHTML;
        }
        setInterval(updateCodePanels, 700);
        updateCodePanels();

        // --- THREE.JS FULL QUANTUM CORE SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.0;
        controls.minDistance = 3.0;
        controls.maxDistance = 15.0;

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        const light = new THREE.PointLight(0x00ffff, 3.0, 50);
        light.position.set(0, 0, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x001133));

        const innerGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.95 });
        const innerCore = new THREE.Mesh(innerGeo, innerMat);
        coreGroup.add(innerCore);

        const shellGeo = new THREE.IcosahedronGeometry(0.9, 2);
        const shellMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, wireframe: true, transparent: true, opacity: 0.65 });
        const outerShell = new THREE.Mesh(shellGeo, shellMat);
        coreGroup.add(outerShell);

        const crystalGroup = new THREE.Group();
        const cryGeo = new THREE.OctahedronGeometry(0.18);
        const cryMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
        for (let i = 0; i < 6; i++) {
            const crystal = new THREE.Mesh(cryGeo, cryMat);
            const angle = (i / 6) * Math.PI * 2;
            crystal.position.set(Math.cos(angle) * 1.8, Math.sin(angle) * 1.8, (Math.random() - 0.5) * 0.5);
            crystalGroup.add(crystal);
        }
        coreGroup.add(crystalGroup);

        const ringMatPrimary = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.5 });
        const ringMatSecondary = new THREE.MeshBasicMaterial({ color: 0x0088ff, wireframe: true, transparent: true, opacity: 0.4 });
        const ringMatGold = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.7 });

        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.025, 16, 80), ringMatPrimary);
        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.035, 16, 100), ringMatSecondary);
        const ring3 = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.02, 12, 90), ringMatGold);
        const ring4 = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.04, 8, 60), ringMatPrimary);

        ring1.rotation.x = Math.PI / 3;
        ring2.rotation.y = Math.PI / 4;
        ring3.rotation.x = -Math.PI / 6;
        ring4.rotation.z = Math.PI / 5;

        coreGroup.add(ring1); coreGroup.add(ring2); coreGroup.add(ring3); coreGroup.add(ring4);

        const particleCount = 900;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 1.6 + Math.random() * 2.0;
            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
        }
        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.05, color: 0x00ffff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending });
        const particleCloud = new THREE.Points(particleGeo, particleMat);
        coreGroup.add(particleCloud);

        camera.position.z = 7.0;

        // --- MEDIAPIPE GESTURES ---
        let targetScale = 1.0, currentScale = 1.0;
        let targetRotX = 0, targetRotY = 0, targetRotZ = 0;

        let isSinglePinching = false, isDualPinching = false;
        let singleStartPt = { x: 0, y: 0 }, baseRotX = 0, baseRotY = 0;
        let dualStartDist = 0, dualStartAngle = 0, baseScale = 1.0, baseRotZ = 0;

        let smoothedHand1 = null, smoothedHand2 = null;

        function checkPinch(landmarks) {
            const thumb = landmarks[4], index = landmarks[8], wrist = landmarks[0], middleMCP = landmarks[9];
            const palmDx = wrist.x - middleMCP.x, palmDy = wrist.y - middleMCP.y;
            const palmSize = Math.sqrt(palmDx * palmDx + palmDy * palmDy) || 0.1;
            const pinchDx = thumb.x - index.x, pinchDy = thumb.y - index.y;
            return (Math.sqrt(pinchDx * pinchDx + pinchDy * pinchDy) / palmSize) < 0.38;
        }

        function smoothLandmarks(current, previous, factor = 0.35) {
            if (!previous) return current;
            return current.map((pt, idx) => ({
                x: previous[idx].x + (pt.x - previous[idx].x) * factor,
                y: previous[idx].y + (pt.y - previous[idx].y) * factor,
                z: previous[idx].z + (pt.z - previous[idx].z) * factor
            }));
        }

        function onResults(results) {
            const handsList = results.multiHandLandmarks;

            if (handsList && handsList.length > 0) {
                smoothedHand1 = smoothLandmarks(handsList[0], smoothedHand1);
                const p1Pinch = checkPinch(smoothedHand1);

                let p2Pinch = false;
                if (handsList.length >= 2) {
                    smoothedHand2 = smoothLandmarks(handsList[1], smoothedHand2);
                    p2Pinch = checkPinch(smoothedHand2);
                } else { smoothedHand2 = null; }

                if (handsList.length >= 2 && p1Pinch && p2Pinch) {
                    const h1 = smoothedHand1[8], h2 = smoothedHand2[8];
                    const dx = h2.x - h1.x, dy = h2.y - h1.y;
                    const curDist = Math.sqrt(dx * dx + dy * dy);
                    const curAngle = Math.atan2(dy, dx);

                    if (!isDualPinching) {
                        isDualPinching = true; isSinglePinching = false;
                        dualStartDist = curDist; dualStartAngle = curAngle;
                        baseScale = targetScale; baseRotZ = targetRotZ;
                    }

                    targetScale = Math.max(0.4, Math.min(3.5, baseScale * (curDist / (dualStartDist || 0.01))));
                    targetRotZ = baseRotZ + (curAngle - dualStartAngle);
                    if (!isListening) statusText.innerText = "STATUS: DUAL PINCH [ZOOM & ROTATE Z]";
                } else if (p1Pinch || p2Pinch) {
                    const activeHand = (p1Pinch ? smoothedHand1 : smoothedHand2)[8];

                    if (!isSinglePinching || isDualPinching) {
                        isSinglePinching = true; isDualPinching = false;
                        singleStartPt = { x: activeHand.x, y: activeHand.y };
                        baseRotX = targetRotX; baseRotY = targetRotY;
                    }

                    targetRotY = baseRotY + (activeHand.x - singleStartPt.x) * 6.0;
                    targetRotX = baseRotX + (activeHand.y - singleStartPt.y) * 6.0;
                    if (!isListening) statusText.innerText = "STATUS: HAND PINCH ROTATE";
                } else {
                    isSinglePinching = false; isDualPinching = false;
                    if (!isListening) statusText.innerText = "STATUS: MOUSE / TOUCH / HANDS ACTIVE";
                }
            } else {
                smoothedHand1 = null; smoothedHand2 = null;
                isSinglePinching = false; isDualPinching = false;
                if (!isListening) statusText.innerText = "STATUS: READY - TOUCH / MOUSE / HANDS";
            }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.65, minTrackingConfidence: 0.65 });
        hands.onResults(onResults);

        const videoElement = document.getElementById('webcam');
        let isProcessing = false;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    async function processVideo() {
                        if (!isProcessing && videoElement.readyState >= 2) {
                            isProcessing = true;
                            await hands.send({ image: videoElement });
                            isProcessing = false;
                        }
                        requestAnimationFrame(processVideo);
                    }
                    processVideo();
                };
            } catch (err) {
                statusText.innerText = "STATUS: MOUSE & TOUCH ACTIVE (NO CAMERA)";
            }
        }
        startCamera();

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            ring1.rotation.z += 0.012; ring1.rotation.y += 0.007;
            ring2.rotation.z -= 0.014; ring2.rotation.x += 0.008;
            ring3.rotation.y += 0.016; ring3.rotation.z += 0.005;
            ring4.rotation.x -= 0.010; ring4.rotation.z -= 0.012;
            innerCore.rotation.x += 0.012; innerCore.rotation.y += 0.012;
            outerShell.rotation.y -= 0.008;
            crystalGroup.rotation.z += 0.010; crystalGroup.rotation.y += 0.006;

            if (isSinglePinching || isDualPinching) {
                coreGroup.rotation.y += (targetRotY - coreGroup.rotation.y) * 0.12;
                coreGroup.rotation.x += (targetRotX - coreGroup.rotation.x) * 0.12;
                coreGroup.rotation.z += (targetRotZ - coreGroup.rotation.z) * 0.12;

                currentScale += (targetScale - currentScale) * 0.12;
                coreGroup.scale.setScalar(currentScale);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
